name: ilalex-vinyl

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ilalex_vinyl}
      POSTGRES_USER: ${POSTGRES_USER:-ilalex_vinyl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      API_READER_PASSWORD: ${API_READER_PASSWORD:?задайте API_READER_PASSWORD в .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  admin:
    build:
      # Dockerfile не копирует исходники — код монтируется бинд-маунтом ниже
      context: ./docker/admin
    restart: unless-stopped
    # Только для dev: бинд-маунты на Windows принадлежат root, поэтому
    # непривилегированный пользователь образа не может писать в storage/.
    # В проде исходники запекаются в образ и контейнер работает от "app".
    user: "0:0"
    env_file:
      - ./apps/admin/.env
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8090}:8080"
    volumes:
      - ./apps/admin:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - edge
    # Перекрывает healthcheck базового образа (тот проверяет админку Caddy)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  # db доступна только отсюда и никогда не публикуется в хостовую сеть
  internal:
    internal: true
  edge:

volumes:
  db_data:
